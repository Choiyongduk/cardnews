name: Daily Cardnews

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00 전날)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # state/ 커밋 push 충돌 방지 (채널별 순차 실행)
      matrix:
        channel: [econ-news-kr, econ-news-us]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Render ${{ matrix.channel }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
        run: python render.py --channel ${{ matrix.channel }}

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-${{ matrix.channel }}
          path: output/${{ matrix.channel }}/
          retention-days: 14

      - name: Commit updated state and pending record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ pending/
          git diff --cached --quiet || git commit -m "chore: render ${{ matrix.channel }} + update state [skip ci]"
          git pull --rebase origin master
          git push
