name: Daily Cardnews

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00 전날) - 출근시간판
    - cron: "0 9 * * *"   # 매일 18:00 KST (UTC 09:00) - 퇴근시간판
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # state/ 커밋 push 충돌 방지 (채널별 순차 실행)
      matrix:
        channel: [econ-news-kr, econ-news-us]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Determine slot (am/pm/manual)
        id: slot
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "slot=manual" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "slot=pm" >> "$GITHUB_OUTPUT"
          else
            echo "slot=am" >> "$GITHUB_OUTPUT"
          fi

      - name: Render ${{ matrix.channel }} (${{ steps.slot.outputs.slot }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
        run: python render.py --channel ${{ matrix.channel }} --slot ${{ steps.slot.outputs.slot }}

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-${{ matrix.channel }}-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: output/${{ matrix.channel }}/
          retention-days: 14

      - name: Commit updated state and pending record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ pending/
          git diff --cached --quiet || git commit -m "chore: render ${{ matrix.channel }} (${{ steps.slot.outputs.slot }}) + update state [skip ci]"
          git pull --rebase origin master
          git push
