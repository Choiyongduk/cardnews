name: Telegram Approval Poll

on:
  schedule:
    - cron: "*/5 * * * *"  # 5분마다 버튼 응답 확인
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install PyYAML python-dotenv requests

      - name: Poll Telegram for approval button responses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poll_telegram.py

      - name: Commit approval decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/ state/telegram_offset.json
          git diff --cached --quiet || git commit -m "chore: record telegram approval decisions [skip ci]"
          git pull --rebase origin master
          git push
