# 채널 설정: 이 파일만 복사·수정하면 새 채널(예: hssup.yaml)을 추가할 수 있습니다.
slug: ai-news
name: 오늘의 AI 뉴스
handle: "@your_ai_news"          # 인스타 계정명으로 교체
template: ai-news               # templates/<template>/ 폴더를 사용
cards: 4                        # 뉴스 카드 수 (표지·마무리 제외)
size:
  width: 1080
  height: 1350

# 소스 타입: sample(현재) | rss | sheet | folder (2단계 이후 구현)
source:
  type: sample
  path: data/sample.json
  # type: rss
  # feeds:
  #   - https://example.com/feed.xml

# 텍스트 길이 기준 (초과 시 경고, 렌더링은 자동 축소로 처리)
limits:
  title: 30
  summary_line: 40
  summary_lines: 3

outro:
  cta_title: 매일 아침 AI 뉴스 받아보기
  cta_body: 팔로우하면 하루 4건, 꼭 알아야 할 소식만 정리해 드립니다.

hashtags:
  - AI뉴스
  - 인공지능
  - AI트렌드
  - 테크뉴스
  - 생성형AI

# 4단계 이후 사용 예정
# schedule: "0 7 * * *"
# approval: telegram
# instagram_token_env: AI_NEWS_IG_TOKEN
